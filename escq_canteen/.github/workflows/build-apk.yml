name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: escq_canteen

      - name: Build APK
        run: flutter build apk --release
        working-directory: escq_canteen

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: escq_canteen/build/app/outputs/flutter-apk/app-release.apk
          name: EscQ-${{ github.ref_name }}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}