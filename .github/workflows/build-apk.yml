name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: escq_canteen

      - name: Create google-services.json
        run: |
          cat > escq_canteen/android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "canteen2-placeholder",
              "storage_bucket": "canteen2-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.escq.canteen"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "PLACEHOLDER_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ]
          }
          EOF
        shell: bash

      - name: Build APK
        run: flutter build apk --release
        working-directory: escq_canteen

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: escq_canteen/build/app/outputs/flutter-apk/app-release.apk
          name: EscQ-${{ github.ref_name }}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}